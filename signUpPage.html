
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="auth-card">

      <div class="logo">MyStore</div>

      <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">Sign In</button>
        <button id="signupTab" onclick="showSignup()">Sign Up</button>
      </div>

      <!-- Login -->
      <form id="loginForm">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Sign in to continue</p>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Enter email">
          <small class="error" id="loginEmailError"></small>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password">
          <small class="error" id="loginPasswordError"></small>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <!-- Signup -->
      <form id="signupForm" class="hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join us today!</p>

        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Enter your name">
          <small class="error" id="nameError"></small>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="Enter email">
          <small class="error" id="emailError"></small>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Minimum 6 characters">
          <small class="error" id="signupPasswordError"></small>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password">
          <small class="error" id="confirmPasswordError"></small>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <!-- Coupon -->
      <div id="couponBox" class="coupon hidden">
        <h3>🎉 Welcome Offer!</h3>
        <p>Get ₹200 OFF on your first purchase.</p>
        <div class="coupon-code">
          <strong>WELCOME200</strong>
          <button onclick="copyCoupon()">Copy</button>
        </div>
        <small id="couponMessage"></small>
      </div>

      <div id="message"></div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
